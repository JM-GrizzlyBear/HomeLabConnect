# Two ways to use this file:
#   docker compose up -d postgres mailpit   the database and mail inbox, for "turbo run dev"
#   docker compose --profile api up --build  also the production API image on http://localhost:8080
name: homelabconnect

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: homelabconnect
      POSTGRES_PASSWORD: homelabconnectpass
      POSTGRES_DB: homelabconnect
    ports:
      - "5436:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homelabconnect -d homelabconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web inbox: http://localhost:8025

  # The image Render runs (Dockerfile): applies the migrations, then starts the API
  api:
    profiles: [api]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://homelabconnect:homelabconnectpass@postgres:5432/homelabconnect
      SESSION_SECRET: ${SESSION_SECRET}
      # http://localhost has no HTTPS, so the cookie can't be HTTPS-only here
      COOKIE_SECURE: "false"
      SMTP_HOST: mailpit
    ports:
      - "8080:4000"

volumes:
  postgres-data:
