name: homelabconnect

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: homelabconnect
      POSTGRES_PASSWORD: homelabconnectpass
      POSTGRES_DB: homelabconnect
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homelabconnect -d homelabconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web inbox: http://localhost:8025

volumes:
  postgres-data:
