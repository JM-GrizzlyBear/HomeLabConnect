name: Deploy

# Run by hand: GitHub → Actions → "Deploy" → Run workflow.
# Needs the repository secrets RENDER_DEPLOY_HOOK and NETLIFY_BUILD_HOOK (README → "Deploying").
on:
  workflow_dispatch:

jobs:
  checks:
    name: Lint, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm exec turbo run lint typecheck arch build

  deploy:
    name: Deploy the API (Render), then the website (Netlify)
    runs-on: ubuntu-latest
    needs: checks
    environment: production
    steps:
      # Render builds the Dockerfile, applies new migrations to Neon, then starts the API
      - name: Trigger Render deploy
        run: curl --fail -X POST "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      - name: Trigger Netlify build
        run: curl --fail -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
